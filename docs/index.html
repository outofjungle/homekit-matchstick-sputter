<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchstick 0x02 Pairing QR code Decoder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #c8c8c8;
      color: #222222;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.4rem;
      color: #111111;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #555555;
      margin-bottom: 2rem;
      text-align: center;
    }

    .led-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .led-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .led-cell img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 0;
      border: none;
      background: #ffffff;
      display: block;
    }

    .led-cell:first-child img {
      border-radius: 8px 0 0 8px;
    }

    .led-cell:last-child img {
      border-radius: 0 8px 8px 0;
    }

    .led-cell .led-label {
      font-size: 0.75rem;
      color: #333333;
    }

    .led-cell .bit-label {
      font-size: 0.65rem;
      color: #777777;
      height: 0.85rem;
    }

    .led-cell input {
      width: 40px;
      height: 40px;
      text-align: center;
      font-size: 1.2rem;
      font-family: monospace;
      font-weight: bold;
      background: #ffffff;
      color: #1a1a1a;
      border: 2px solid #999999;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s;
    }

    .led-cell input:focus {
      border-color: #333333;
    }

    .led-cell input.valid-0 {
      border-color: #3355bb;
      color: #3355bb;
    }

    .led-cell input.valid-1 {
      border-color: #bb3333;
      color: #bb3333;
    }

    /* Mobile tap-target button */
    .led-tap-btn {
      min-width: 44px;
      min-height: 44px;
      background: #e0e0e0;
      border: 2px solid #999999;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
      font-family: monospace;
      font-weight: bold;
      color: #555555;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: background 0.1s, border-color 0.1s;
    }

    .led-tap-btn[data-val="0"] {
      border-color: #3355bb;
      color: #3355bb;
      background: #e8ecf8;
    }

    .led-tap-btn[data-val="1"] {
      border-color: #bb3333;
      color: #bb3333;
      background: #f8e8e8;
    }

    .legend {
      font-size: 0.8rem;
      color: #333333;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1.5rem;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red {
      background: #cc4444;
    }

    .dot-blue {
      background: #4466cc;
    }

    .result {
      font-family: monospace;
      font-size: 1.4rem;
      color: #222222;
      min-height: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .result .hex-value {
      color: #000000;
      font-weight: bold;
    }

    .release-link {
      min-height: 1.8rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .release-link img {
      max-width: 280px;
      width: 100%;
      border: 4px solid #ffffff;
      border-radius: 4px;
    }

    .release-link .qr-error {
      display: inline-block;
      background: #f4b8b8;
      color: #6b1a1a;
      font-size: 1.4rem;
      font-family: monospace;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
    }

    button.reset-btn {
      background: #555555;
      color: #ffffff;
      border: 1px solid #aaaaaa;
      border-radius: 4px;
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button.reset-btn:hover {
      background: #333333;
      color: #ffffff;
    }

    .github-link {
      display: block;
      margin-top: 0.8rem;
      color: #555555;
      transition: color 0.15s;
    }

    .github-link:hover {
      color: #222222;
    }

    .github-link svg {
      display: block;
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* ── Mobile overrides ────────────────────────────────────────── */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.1rem;
      }

      .subtitle {
        font-size: 0.8rem;
        margin-bottom: 1.2rem;
      }

      .led-row {
        width: 100%;
      }

      .led-cell {
        flex: 1 1 0;
        min-width: 0;
      }

      .led-cell img {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
      }

      .led-cell .led-label {
        font-size: 0.6rem;
      }

      .led-cell .bit-label {
        font-size: 0.55rem;
      }

      .mobile-hidden {
        display: none !important;
      }

      .led-tap-btn {
        width: 100%;
        min-height: 44px;
        font-size: 1rem;
      }

      button.reset-btn {
        min-height: 44px;
        padding: 0.6rem 1.5rem;
      }

      .release-link img {
        max-width: 220px;
      }
    }
  </style>
</head>

<body>
  <h1>Matchstick 0x02 Pairing QR code Decoder</h1>
  <p class="subtitle">Read the 8 LEDs left-to-right during factory reset, then enter each bit below.</p>

  <div class="legend">
    <span><span class="dot dot-red"></span> Red = 1</span>
    <span><span class="dot dot-blue"></span> Blue = 0</span>
  </div>

  <div class="led-row" id="ledRow"></div>

  <div class="result" id="result"></div>
  <div class="release-link" id="releaseLink"></div>
  <button class="reset-btn" onclick="resetAll()">Clear / Reset</button>
  <a class="github-link" href="https://github.com/outofjungle/homekit-matchstick-sputter" title="View on GitHub">
    <svg viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/></svg>
  </a>

  <script>
    const IMGS = { '': 'img/white.png', '0': 'img/blue.png', '1': 'img/red.png' };
    const REPO = 'https://github.com/outofjungle/homekit-matchstick-sputter';

    // State array — source of truth for all 8 LED values ('', '0', or '1')
    const values = ['', '', '', '', '', '', '', ''];

    const images = [];
    const inputs = []; // desktop inputs (may be empty on mobile)
    const row = document.getElementById('ledRow');

    function isMobile() {
      return window.matchMedia('(max-width: 480px)').matches;
    }

    function buildCell(pos) {
      const ledNum = 8 - pos; // LED 8 → pos 0 (MSB), LED 1 → pos 7 (LSB)

      const cell = document.createElement('div');
      cell.className = 'led-cell';
      cell.dataset.pos = pos;

      const img = document.createElement('img');
      img.src = IMGS[values[pos]];
      img.alt = `LED ${ledNum}`;
      images[pos] = img;

      const label = document.createElement('div');
      label.className = 'led-label';
      label.textContent = `LED ${ledNum}`;

      const bitLabel = document.createElement('div');
      bitLabel.className = 'bit-label';
      if (pos === 0) bitLabel.textContent = 'MSB';
      else if (pos === 7) bitLabel.textContent = 'LSB';

      cell.appendChild(img);
      cell.appendChild(label);
      cell.appendChild(bitLabel);

      if (isMobile()) {
        const btn = document.createElement('button');
        btn.className = 'led-tap-btn';
        btn.type = 'button';

        function applyBtnState() {
          const v = values[pos];
          btn.dataset.val = v;
          btn.textContent = v === '' ? '?' : v;
          const stateLabel = v === '' ? 'blank' : (v === '0' ? 'blue (0)' : 'red (1)');
          btn.setAttribute('aria-label', `LED ${ledNum}: ${stateLabel}, tap to change`);
          img.src = IMGS[v];
        }

        applyBtnState();

        btn.addEventListener('click', () => {
          // Cycle: '' → '0' → '1' → ''
          const cycle = { '': '0', '0': '1', '1': '' };
          values[pos] = cycle[values[pos]];
          applyBtnState();
          update();
        });

        cell.appendChild(btn);
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.inputMode = 'numeric';
        input.setAttribute('aria-label', `LED ${ledNum}`);
        input.value = values[pos];
        if (values[pos] === '0' || values[pos] === '1') {
          input.className = `valid-${values[pos]}`;
        }
        inputs[pos] = input;

        input.addEventListener('keydown', (e) => {
          if (e.key === '0' || e.key === '1') return;
          if (e.key === 'Backspace') {
            e.preventDefault();
            values[pos] = '';
            input.value = '';
            input.className = '';
            images[pos].src = IMGS[''];
            update();
            if (pos > 0) inputs[pos - 1].focus();
            return;
          }
          if (['Delete', 'Tab', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
          e.preventDefault();
        });

        input.addEventListener('input', () => {
          const val = input.value;
          if (val !== '0' && val !== '1') {
            values[pos] = '';
            input.value = '';
            input.className = '';
            images[pos].src = IMGS[''];
          } else {
            values[pos] = val;
            input.className = `valid-${val}`;
            images[pos].src = IMGS[val];
            if (pos < 7) inputs[pos + 1].focus();
          }
          update();
        });

        cell.appendChild(input);
      }

      return cell;
    }

    function rebuildControls() {
      row.innerHTML = '';
      images.length = 0;
      inputs.length = 0;
      for (let pos = 0; pos < 8; pos++) {
        row.appendChild(buildCell(pos));
      }
      if (!isMobile() && inputs[0]) {
        inputs[0].focus();
      }
      update();
    }

    function update() {
      const allValid = values.every(v => v === '0' || v === '1');

      const resultEl = document.getElementById('result');
      const linkEl = document.getElementById('releaseLink');

      if (!allValid) {
        resultEl.innerHTML = '';
        linkEl.innerHTML = '';
        return;
      }

      // values[0] = LED 8 = MSB (bit 7), values[7] = LED 1 = LSB (bit 0)
      const decimal = values.reduce((acc, bit) => (acc << 1) | parseInt(bit, 10), 0);
      const hex = decimal.toString(16).toUpperCase().padStart(2, '0');
      const tag = `release-0x${hex}`;

      resultEl.innerHTML = `Firmware version: <span class="hex-value">0x${hex}</span>`;

      const rawUrl = `https://raw.githubusercontent.com/outofjungle/homekit-matchstick-sputter/refs/tags/${tag}/docs/img/pairing_qr.png`;
      linkEl.innerHTML = '';
      const qrImg = document.createElement('img');
      qrImg.alt = `QR code for ${tag}`;
      qrImg.src = rawUrl;
      qrImg.onerror = () => {
        linkEl.innerHTML = `<span class="qr-error">Invalid release version ${tag} — QR code not found</span>`;
      };
      linkEl.appendChild(qrImg);
    }

    function resetAll() {
      for (let i = 0; i < 8; i++) {
        values[i] = '';
      }
      // Rebuild to reflect cleared state (handles both modes)
      rebuildControls();
      document.getElementById('result').innerHTML = '';
      document.getElementById('releaseLink').innerHTML = '';
    }

    // Rebuild on orientation/resize changes that cross the breakpoint
    const mq = window.matchMedia('(max-width: 480px)');
    let lastMobile = mq.matches;
    mq.addEventListener('change', (e) => {
      if (e.matches !== lastMobile) {
        lastMobile = e.matches;
        rebuildControls();
      }
    });

    // Initial build
    rebuildControls();
  </script>
</body>

</html>
